services:
  buildsim:
    build:
      context: ./../D7065E-buildsim/buildingsim
    command: ["start", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/buildsim", "health", "--url", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    #entrypoint: ["/bin/sh", "/deploy/entrypoint.sh"]
    environment:
      MQTT_PASSWORDS: >-
        physics:physics-pw sensor:sensor-pw controller:controller-pw
        actuator:actuator-pw storage:storage-pw viz:viz-pw
    volumes:
      - ./deploy/mosquitto/config:/mosquitto/config
      - ./deploy/mosquitto/data:/mosquitto/data
      - ./deploy/mosquitto/log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"
    restart: unless-stopped
  occupancysim:
    build:
      context: ./external/occupancysim
    environment:
      BUILDSIM_URL: http://buildsim:9090
      BUILDSIM_PUBLIC_URL: http://127.0.0.1:9090
      OCCUPANCY_FACTOR: "60"   # simulated seconds per real second
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      buildsim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/buildsim", "health", "--url", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped