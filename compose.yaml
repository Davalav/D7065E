services:
  buildsim:
    build:
      context: ./../D7065E-buildsim/buildingsim
    command: ["start", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "/buildsim", "health", "--url", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    #entrypoint: ["/bin/sh", "/deploy/entrypoint.sh"]
    environment:
      MQTT_PASSWORDS: >-
        physics:physics-pw sensor:sensor-pw controller:controller-pw
        actuator:actuator-pw storage:storage-pw viz:viz-pw
    volumes:
      - ./deploy/mosquitto/config:/mosquitto/config
      - ./deploy/mosquitto/data:/mosquitto/data
      - ./deploy/mosquitto/log:/mosquitto/log
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-p", "1883", "-t", "healthcheck", "-m", "ok", "-q", "0"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
  occupancysim:
    build:
      context: ./../D7065E-buildsim//occupancysim
    environment:
      BUILDSIM_URL: http://buildsim:9090
      BUILDSIM_PUBLIC_URL: http://127.0.0.1:9090
      OCCUPANCY_FACTOR: "60"   # simulated seconds per real second
      OCCUPANCY_CONFIG: /config/occupancy.json
    volumes:
      - ./occupancy-config.json:/config/occupancy.json
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      buildsim:
        condition: service_healthy
    # The scratch image has no shell or curl, and /occupancy has no health
    # subcommand (it would start a second simulator), so dependents only wait
    # for the container to start and retry until the API answers.
    healthcheck:
      disable: true
    restart: unless-stopped
  metrics-exporter:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-u", "metrics-exporter.py"]
    environment:
      BUILDSIM_URL: http://buildsim:9090
      OCCUPANCY_URL: http://occupancysim:8081
      METRICS_PORT: "9101"
    depends_on:
      buildsim:
        condition: service_healthy
      occupancysim:
        condition: service_started
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:rw,noexec,nosuid,uid=65534,gid=65534,mode=0770
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      metrics-exporter:
        condition: service_started
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
volumes:
  grafana-data: